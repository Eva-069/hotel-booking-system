openapi: 3.1.1
info:
  title: Інформаційна система бронювання готелю — API
  description: >
    API-контракт для навчального прототипу курсової роботи з дисципліни
    «Проєктування інформаційних систем». Реалізує операції бронювання
    номерів, оплати (через мок-провайдер), заселення/виїзду та прибирання.
  version: "1.0.0"
servers:
  - url: https://api.hotel-booking.local/v1
    description: Навчальний прототип (мок-сервер)

tags:
  - name: Rooms
    description: Перегляд номерів та їх статусів
  - name: Bookings
    description: Створення та керування бронюваннями
  - name: Payments
    description: Оплата бронювання (мок-провайдер)
  - name: Cleaning
    description: Операції персоналу прибирання

security:
  - bearerAuth: []

paths:
  /rooms/availability:
    get:
      tags: [Rooms]
      summary: Переглянути доступність номерів за датами (US-01)
      x-roles: [client, admin]
      parameters:
        - name: checkIn
          in: query
          required: true
          schema: { type: string, format: date }
          example: "2026-11-10"
        - name: checkOut
          in: query
          required: true
          schema: { type: string, format: date }
          example: "2026-11-13"
        - name: category
          in: query
          required: false
          schema: { $ref: '#/components/schemas/RoomCategory' }
      responses:
        "401":
          description: Відсутній або недійсний токен автентифікації
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "403":
          description: Дія недоступна ролі поточного користувача
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "200":
          description: Перелік вільних номерів на вказаний період
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Room' }
        "422":
          description: Некоректний діапазон дат (checkOut <= checkIn)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /bookings:
    get:
      tags: [Bookings]
      summary: Переглянути всі бронювання (панель адміністратора, US-05..US-07)
      description: >
        Додано під час реалізації прототипу: початкова версія контракту не містила
        операції загального переліку бронювань для ролі адміністратора.
      x-roles: [admin]
      responses:
        "401":
          description: Відсутній або недійсний токен автентифікації
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "200":
          description: Перелік усіх бронювань (крім чернеток) з іменем клієнта та номером кімнати
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/Booking'
                    - type: object
                      properties:
                        clientName: { type: string }
                        roomNumber: { type: string }
                        roomCategory: { $ref: '#/components/schemas/RoomCategory' }
        "403":
          description: Дія недоступна ролям client та cleaning_staff
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /bookings/draft:
    post:
      tags: [Bookings]
      summary: Створити чернетку бронювання з розрахунком вартості (US-02, крок 1-2)
      x-roles: [client]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingDraftRequest' }
      responses:
        "403":
          description: Дія недоступна ролі поточного користувача
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "201":
          description: Чернетку створено, повернуто суму до оплати
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingDraft' }
        "401":
          description: Відсутній або недійсний токен автентифікації
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "409":
          description: Номер недоступний на вказані дати (конфлікт бронювання)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                code: resource_unavailable
                message: "Обраний номер вже заброньовано на ці дати"
        "422":
          description: Некоректні вхідні дані (дати, кількість послуг)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /payments:
    post:
      tags: [Payments]
      summary: Провести оплату чернетки бронювання й утримати номер (US-02, крок 3-4)
      x-roles: [client]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentRequest' }
      responses:
        "401":
          description: Відсутній або недійсний токен автентифікації
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "403":
          description: Дія недоступна ролі поточного користувача
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "404":
          description: Ресурс не знайдено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "201":
          description: Оплата успішна, бронювання створено, номер утримано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        "402":
          description: Оплату відхилено платіжною системою
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                code: payment_declined
                message: "Платіжна система відхилила оплату. Спробуйте ще раз."
        "409":
          description: Номер уже утримано іншим бронюванням (конкурентний запит)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "422":
          description: Сума оплати не відповідає розрахованій вартості чернетки
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /bookings/mine:
    get:
      tags: [Bookings]
      summary: Переглянути власні бронювання (US-03)
      x-roles: [client]
      responses:
        "401":
          description: Відсутній або недійсний токен автентифікації
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "403":
          description: Дія недоступна ролі поточного користувача
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "200":
          description: Перелік бронювань поточного клієнта
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Booking' }

  /bookings/{id}/cancel:
    post:
      tags: [Bookings]
      summary: Скасувати бронювання до заїзду (US-04)
      x-roles: [client]
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        "401":
          description: Відсутній або недійсний токен автентифікації
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "200":
          description: Бронювання скасовано, номер звільнено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        "403":
          description: Бронювання належить іншому клієнту
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "404":
          description: Бронювання не знайдено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "409":
          description: Бронювання вже заселено або скасовано — скасування неможливе
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /bookings/{id}/confirm:
    post:
      tags: [Bookings]
      summary: Підтвердити оплачену заявку на бронювання (US-05)
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        "401":
          description: Відсутній або недійсний токен автентифікації
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "404":
          description: Ресурс не знайдено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "200":
          description: Бронювання підтверджено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        "403":
          description: Дія недоступна ролі клієнта
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "409":
          description: Бронювання не в статусі «paid» — підтвердження неможливе
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                code: invalid_status_transition
                message: "Підтвердити можна лише оплачене бронювання"

  /bookings/{id}/reject:
    post:
      tags: [Bookings]
      summary: Відхилити заявку на бронювання (US-05, негативний сценарій)
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/BookingId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "401":
          description: Відсутній або недійсний токен автентифікації
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "403":
          description: Дія недоступна ролі поточного користувача
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "404":
          description: Ресурс не знайдено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "200":
          description: Бронювання відхилено, ініційовано ручне повернення коштів
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        "422":
          description: Тіло запиту не є коректним JSON
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "409":
          description: Бронювання не в статусі, що допускає відхилення
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /bookings/{id}/check-in:
    post:
      tags: [Bookings]
      summary: Оформити заселення клієнта (US-06)
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        "401":
          description: Відсутній або недійсний токен автентифікації
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "403":
          description: Дія недоступна ролі поточного користувача
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "404":
          description: Ресурс не знайдено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "200":
          description: Клієнта заселено, номер переведено у статус occupied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        "409":
          description: Бронювання не підтверджено — заселення неможливе
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /bookings/{id}/check-out:
    post:
      tags: [Bookings]
      summary: Оформити виїзд клієнта (US-07)
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        "401":
          description: Відсутній або недійсний токен автентифікації
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "403":
          description: Дія недоступна ролі поточного користувача
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "404":
          description: Ресурс не знайдено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "200":
          description: Виїзд оформлено, номер переведено у статус needs_cleaning
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Booking' }
        "409":
          description: Клієнта не заселено — виїзд неможливий
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /rooms/cleaning-queue:
    get:
      tags: [Cleaning]
      summary: Переглянути перелік номерів, що потребують прибирання (US-08)
      x-roles: [cleaning_staff]
      responses:
        "401":
          description: Відсутній або недійсний токен автентифікації
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "403":
          description: Дія недоступна ролі поточного користувача
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "200":
          description: Перелік номерів зі статусом needs_cleaning
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Room' }

  /rooms/{id}/mark-cleaned:
    post:
      tags: [Cleaning]
      summary: Позначити номер прибраним (US-08)
      x-roles: [cleaning_staff]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "401":
          description: Відсутній або недійсний токен автентифікації
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "403":
          description: Дія недоступна ролі поточного користувача
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "404":
          description: Ресурс не знайдено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        "200":
          description: Номер переведено у статус ready
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Room' }
        "409":
          description: Номер не перебуває у статусі needs_cleaning
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                code: invalid_status_transition
                message: "Позначити прибраним можна лише номер зі статусом «потребує прибирання»"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    BookingId:
      name: id
      in: path
      required: true
      schema: { type: integer }
      example: 1042

  schemas:
    RoomCategory:
      type: string
      enum: [standard, comfort, lux]

    RoomStatus:
      type: string
      enum: [free, held, occupied, needs_cleaning, ready]

    BookingStatus:
      type: string
      enum: [draft, paid, confirmed, checked_in, checked_out, cancelled, rejected]

    Room:
      type: object
      properties:
        id: { type: integer, example: 12 }
        number: { type: string, example: "204" }
        category: { $ref: '#/components/schemas/RoomCategory' }
        basePrice: { type: number, format: decimal, example: 1450.00 }
        status: { $ref: '#/components/schemas/RoomStatus' }

    BookingDraftRequest:
      type: object
      required: [roomId, checkInDate, checkOutDate]
      properties:
        roomId: { type: integer, example: 12 }
        checkInDate: { type: string, format: date, example: "2026-11-10" }
        checkOutDate: { type: string, format: date, example: "2026-11-13" }
        serviceIds:
          type: array
          items: { type: integer }
          example: [1, 3]

    BookingDraft:
      type: object
      properties:
        draftId: { type: string, format: uuid }
        roomId: { type: integer }
        checkInDate: { type: string, format: date }
        checkOutDate: { type: string, format: date }
        services:
          type: array
          items:
            type: object
            properties:
              serviceId: { type: integer }
              name: { type: string }
              price: { type: number }
        totalPrice: { type: number, example: 4850.00 }
        currency: { type: string, example: "UAH" }

    PaymentRequest:
      type: object
      required: [draftId, amount, currency]
      properties:
        draftId: { type: string, format: uuid }
        amount: { type: number, example: 4850.00 }
        currency: { type: string, example: "UAH" }

    Booking:
      type: object
      properties:
        id: { type: integer, example: 1042 }
        roomId: { type: integer }
        checkInDate: { type: string, format: date }
        checkOutDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/BookingStatus' }
        totalPrice: { type: number }
        createdAt: { type: string, format: date-time, example: "2026-10-01T09:15:00Z" }
        checkedInAt: { type: string, format: date-time, nullable: true }
        checkedOutAt: { type: string, format: date-time, nullable: true }

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: resource_unavailable
        message:
          type: string
          example: "Обраний номер вже заброньовано на ці дати"
        details:
          type: object
          additionalProperties: true
