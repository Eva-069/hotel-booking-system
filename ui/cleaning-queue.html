<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Черга прибирання — Система бронювання готелю</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a href="#main" class="skip-link">Перейти до вмісту</a>
<header class="topbar">
  <div class="brand">Готель <span>«Либідь»</span></div>
  <nav><a href="cleaning-queue.html" class="active">Черга прибирання</a></nav>
  <div class="role-chip">Персонал прибирання</div>
</header>

<main id="main" class="page">
  <p class="eyebrow-free">Екрани 10–11 · US-08 · стани: успіх / порожньо</p>
  <h1 class="page-title">Номери, що потребують прибирання</h1>
  <div id="alert-area"></div>
  <div class="panel" style="padding:0;overflow-x:auto;" id="panel"></div>
</main>

<script src="app.js"></script>
<script>
  requireRole("cleaning_staff");
  async function load() {
    const res = await api("/rooms/cleaning-queue");
    const panel = document.getElementById("panel");
    if (!res.ok) { panel.innerHTML = ""; return; }
    if (res.data.length === 0) {          // екран 11: порожній стан
      panel.innerHTML = `<div class="empty-state"><div class="empty-icon">✓</div><h2>Усі номери прибрано</h2>
        <p>Наразі жоден номер не потребує прибирання. Список оновиться після виїзду клієнтів.</p></div>`;
      return;
    }
    // екран 10: перелік (персональні дані клієнтів не відображаються — T-02, NFR-02)
    panel.innerHTML = `<table class="data"><thead><tr><th>Номер</th><th>Категорія</th><th>Статус</th><th>Дія</th></tr></thead><tbody>` +
      res.data.map((r) => `<tr><td class="mono">${escapeHtml(r.number)}</td><td>${CATEGORY_UA[r.category]}</td>
        <td><span class="badge badge-cleaning">Потребує прибирання</span></td>
        <td><button class="btn-primary btn-sm" data-room="${r.id}">Позначити прибраним</button></td></tr>`).join("") + `</tbody></table>`;
    panel.querySelectorAll("[data-room]").forEach((btn) => btn.addEventListener("click", async () => {
      const r = await api(`/rooms/${btn.dataset.room}/mark-cleaned`, { method: "POST", body: JSON.stringify({}) });
      document.getElementById("alert-area").innerHTML = r.ok ? "" :
        `<div class="banner banner-error" role="alert"><span class="banner-icon">!</span><div><strong>Дію не виконано</strong>${escapeHtml(r.data?.message || "")}</div></div>`;
      load();
    }));
  }
  load();
</script>
</body>
</html>
